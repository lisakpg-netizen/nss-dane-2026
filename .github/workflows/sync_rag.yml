name: Sync RAG Database (NSS Afs)

on:
  push:
    branches: [main]
    paths:
      - "judikatura/**/*.md"
      - "scripts/sync_gemini_rag.py"
  workflow_dispatch:
    inputs:
      max_uploads:
        description: "Max počet souborů v jedné dávce (doporučeno 250)"
        required: false
        default: "250"
      min_year:
        description: "Indexovat od roku (0 = všechny roky automaticky)"
        required: false
        default: "0"
      auto_continue:
        description: "Automaticky spustit další dávku, dokud nebude hotovo (true/false)"
        required: false
        default: "true"
      force_resync:
        description: "Přeindexovat všechny soubory znovu (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

jobs:
  sync-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Převzetí repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace Google GenAI SDK
        run: pip install --upgrade google-genai

      - name: Synchronizace rozhodnutí NSS do Gemini RAG
        id: sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RESYNC: ${{ github.event.inputs.force_resync || 'false' }}
          MAX_UPLOADS: ${{ github.event.inputs.max_uploads || '250' }}
          MIN_YEAR: ${{ github.event.inputs.min_year || '0' }}
        run: |
          set -o pipefail
          python scripts/sync_gemini_rag.py | tee sync.log
          if grep -q "Dosažen limit dávky" sync.log; then
            echo "has_more=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_more=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Uložení stavu indexu do repozitáře
        if: always()
        run: |
          if [ -f registry/rag_index.json ]; then
            git config user.name "NSS RAG Bot"
            git config user.email "bot@taxlaw.cloud"
            git add registry/rag_index.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: update NSS RAG index [skip ci]"
              git pull --rebase origin main
              git push origin main
            fi
          fi

      - name: Spustit další dávku automaticky
        if: steps.sync.outputs.has_more == 'true' && github.event.inputs.auto_continue != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 15
          gh workflow run sync_rag.yml \
            -f max_uploads="${{ github.event.inputs.max_uploads || '250' }}" \
            -f min_year="${{ github.event.inputs.min_year || '0' }}" \
            -f auto_continue="true"
