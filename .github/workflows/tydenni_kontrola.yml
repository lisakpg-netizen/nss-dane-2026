name: Týdenní monitoring judikatury NSS (Afs)

on:
  schedule:
    - cron: '0 6 * * 1'   # Každé pondělí v 6:00 UTC (7:00 / 8:00 CET)
  workflow_dispatch:       # Tlačítko pro okamžité ruční spuštění

permissions:
  contents: write

jobs:
  nss-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Převzetí repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace knihoven
        run: pip install httpx beautifulsoup4 markdownify google-genai

      - name: Spuštění kontroly, analýzy a odeslání e-mailu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper_nss_digest.py

      - name: Uložení nových rozhodnutí a archivu do repozitáře
        run: |
          git config --global user.name "NSS Bot"
          git config --global user.email "bot@taxlaw.cloud"
          git add -A
          if git diff --staged --quiet; then
            echo "Žádné nové změny k uložení."
          else
            git commit -m "Auto: synchronizace judikatury NSS a archivu [skip ci]"
            git push
          fi
