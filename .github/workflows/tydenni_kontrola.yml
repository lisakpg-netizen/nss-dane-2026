name: Tydenni stahovani rozhodnuti NSS Afs (2026)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx beautifulsoup4 markdownify
      - run: python scraper_2026.py
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NSS Automat"
          git add judikatura/
          git diff --staged --quiet || (git commit -m "Auto: aktualizace NSS Afs 2026" && git push)
