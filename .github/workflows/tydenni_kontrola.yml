- name: Instalace knihoven
        run: pip install --upgrade httpx beautifulsoup4 markdownify google-genai

      - name: Spuštění kontroly, analýzy a odeslání e-mailu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper_2026.py

      - name: Synchronizace nových rozhodnutí do RAG databáze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/sync_gemini_rag.py

      - name: Uložení nových rozhodnutí a archivu do repozitáře
        run: |
          git config --global user.name "NSS Bot"
          git config --global user.email "bot@taxlaw.cloud"
          git add -A
          if git diff --staged --quiet; then
            echo "Žádné nové změny k uložení."
          else
            git commit -m "Auto: synchronizace judikatury NSS a archivu [skip ci]"
            git push
          fi
